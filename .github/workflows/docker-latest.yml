
name: Docker Latest

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    name: Latest - Java ${{ matrix.java }}

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25, 26, 27]

    concurrency:
      group: docker-latest-java-${{ matrix.java }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download Java artifact
        uses: actions/download-artifact@v4
        with:
          name: application-java-${{ matrix.java }}
          path: target/libs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate JAR
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find target/libs -maxdepth 1 -type f \
              -name '*.jar' \
              ! -name '*-plain.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              | sort
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one executable JAR"
            exit 1
          fi

          test -s "${jars[0]}"
          echo "JAR: ${jars[0]}"

      - name: Prepare image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=java-${{ matrix.java }}-latest
            type=raw,value=java-${{ matrix.java }}-sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.java }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=java-${{ matrix.java }}
          cache-to: type=gha,mode=max,scope=java-${{ matrix.java }}
          provenance: true

      - name: Publish summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          JAVA_VERSION: ${{ matrix.java }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "## Docker Latest - Java $JAVA_VERSION"
            echo ""
            echo "Image: \`$IMAGE:java-$JAVA_VERSION-latest\`"
            echo ""
            echo "Commit: \`$SHA\`"
            echo ""
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
