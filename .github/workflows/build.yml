
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build with JDK ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25, 26, 27]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -PjavaVersion=${{ matrix.java }}

      - name: Prepare application JAR
        if: matrix.java == 25 && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p docker-artifact

          mapfile -t jars < <(
            find build/libs \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-plain.jar' \
              | sort
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one executable JAR"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[0]}" docker-artifact/application.jar

      - name: Upload application JAR
        if: matrix.java == 25 && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: docker-artifact/application.jar
          if-no-files-found: error
          retention-days: 7
