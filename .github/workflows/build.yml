
name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build with JDK ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25, 26, 27]

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install selected JDK
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Configure Gradle and dependency caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compile and run tests
      - name: Build
        run: |
          ./gradlew build \
            -PjavaVersion=${{ matrix.java }} \
            --no-daemon

      # Validate executable JAR
      - name: Validate JAR
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find target/libs \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-plain.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              | sort
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one executable JAR"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          test -s "${jars[0]}"

          echo "Executable JAR: ${jars[0]}"

      # Publish JAR using its original filename
      - name: Upload Java artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: application-java-${{ matrix.java }}
          path: |
            target/libs/*.jar
            !target/libs/*-plain.jar
            !target/libs/*-sources.jar
            !target/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-source-info:
    name: Publish source information
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare source information
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p source-info

          printf '%s\n' "$SOURCE_REF" > source-info/ref
          printf '%s\n' "$SOURCE_SHA" > source-info/sha

          echo "Source ref: $SOURCE_REF"
          echo "Source SHA: $SOURCE_SHA"

      - name: Upload source information
        uses: actions/upload-artifact@v4
        with:
          name: source-info
          path: source-info/
          if-no-files-found: error
          retention-days: 14
