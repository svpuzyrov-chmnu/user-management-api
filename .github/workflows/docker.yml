
name: Docker Build

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  prepare:
    name: Prepare Docker publication
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    outputs:
      publish_type: ${{ steps.source.outputs.publish_type }}
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Download source information
        uses: actions/download-artifact@v4
        with:
          name: source-info
          path: source-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve publication type
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          REF="$(cat source-info/ref)"
          SHA="$(cat source-info/sha)"

          if [[ "$SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Source SHA mismatch"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [[ "$REF" == "refs/heads/master" ]]; then
            echo "publish_type=latest" >> "$GITHUB_OUTPUT"

          elif [[ "$REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"

            echo "publish_type=release" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          else
            echo "publish_type=skip" >> "$GITHUB_OUTPUT"
          fi

  publish-latest:
    name: Latest - Java ${{ matrix.java }}
    needs: prepare

    if: needs.prepare.outputs.publish_type == 'latest'

    runs-on: ubuntu-latest

    concurrency:
      group: docker-main-publication
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25, 26, 27]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download Java artifact
        uses: actions/download-artifact@v4
        with:
          name: application-java-${{ matrix.java }}
          path: target/libs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate JAR
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find target/libs \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-plain.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar'
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one executable JAR"
            exit 1
          fi

          test -s "${jars[0]}"

      - name: Prepare image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=java-${{ matrix.java }}-latest
            type=raw,value=java-${{ matrix.java }}-sha-${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.java }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=java-${{ matrix.java }}
          cache-to: type=gha,mode=max,scope=java-${{ matrix.java }}
          provenance: true

      - name: Publish summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          JAVA_VERSION: ${{ matrix.java }}
          SHA: ${{ needs.prepare.outputs.sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "## Latest - Java $JAVA_VERSION"
            echo ""
            echo "Image: \`$IMAGE:java-$JAVA_VERSION-latest\`"
            echo ""
            echo "Commit: \`$SHA\`"
            echo ""
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Release ${{ needs.prepare.outputs.version }} - Java ${{ matrix.java }}
    needs: prepare

    if: needs.prepare.outputs.publish_type == 'release'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25, 26, 27]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download Java artifact
        uses: actions/download-artifact@v4
        with:
          name: application-java-${{ matrix.java }}
          path: target/libs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate JAR
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find target/libs \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-plain.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar'
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one executable JAR"
            exit 1
          fi

          test -s "${jars[0]}"

      - name: Prepare image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-java-${{ matrix.java }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push release
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.java }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=java-${{ matrix.java }}
          cache-to: type=gha,mode=max,scope=java-${{ matrix.java }}
          provenance: true

      - name: Publish release summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          JAVA_VERSION: ${{ matrix.java }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "## Release $VERSION - Java $JAVA_VERSION"
            echo ""
            echo "Image: \`$IMAGE:$VERSION-java-$JAVA_VERSION\`"
            echo ""
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
